<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021a14" />
      <stop offset="40%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="earthGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Cosmic / Agri-Tech Canvas Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Subtle Geospatial Grid Lines -->
  <g stroke="#10b981" stroke-width="0.75" opacity="0.15">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Stylized 3D Earth Globe on Right Side -->
  <g transform="translate(920, 315)">
    <!-- Atmospheric Glow -->
    <circle cx="0" cy="0" r="230" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
    <!-- Earth Sphere -->
    <circle cx="0" cy="0" r="190" fill="url(#earthGrad)" stroke="#38bdf8" stroke-width="2.5" />
    
    <!-- Stylized Continents (Africa / Middle East / Nile Delta) -->
    <path d="M-50 -100 C-30 -120 10 -110 30 -80 C45 -55 70 -40 60 -10 C50 15 20 40 10 90 C-10 130 -40 120 -60 80 C-80 50 -100 10 -90 -40 C-80 -80 -65 -90 -50 -100 Z" fill="#10b981" opacity="0.85" />
    <!-- Nile River & Delta Vein -->
    <path d="M5 -5 C12 -25 15 -45 22 -65 M22 -65 L10 -85 M22 -65 L32 -82" stroke="#6ee7b7" stroke-width="3" fill="none" stroke-linecap="round" />
    
    <!-- Delineated Precision Farm Polygon on Globe -->
    <polygon points="12,-55 35,-60 40,-42 20,-38" fill="#34d399" fill-opacity="0.45" stroke="#fef08a" stroke-width="2.5" stroke-dasharray="4 2" />
    <circle cx="27" cy="-49" r="3.5" fill="#fef08a" />

    <!-- Orbital Trajectory Line -->
    <ellipse cx="0" cy="0" rx="260" ry="110" fill="none" stroke="#34d399" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.7" transform="rotate(-32)" />

    <!-- Active Satellite Sensor -->
    <g transform="translate(140, -170) rotate(18) scale(1.3)">
      <rect x="-10" y="-8" width="20" height="16" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="-30" y="-5" width="16" height="10" rx="1.5" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
      <rect x="14" y="-5" width="16" height="10" rx="1.5" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
      <circle cx="0" cy="0" r="3" fill="#facc15" />
      <line x1="0" y1="8" x2="-60" y2="85" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6" />
    </g>
  </g>

  <!-- Left Content Branding & Typography -->
  <g transform="translate(80, 110)">
    <!-- Badge -->
    <rect width="260" height="38" rx="19" fill="#065f46" stroke="#10b981" stroke-width="1.5" opacity="0.9" />
    <text x="130" y="24" font-family="'Cairo', sans-serif" font-size="14" font-weight="700" fill="#a7f3d0" text-anchor="middle">
      🛰️ الذكاء الزراعي الجغرافي الفضائي
    </text>

    <!-- Main Title: English & Arabic -->
    <text x="0" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-1">
      GeoAgri <tspan fill="url(#textGrad)">Pro</tspan>
    </text>

    <!-- Arabic Subtitle -->
    <text x="0" y="170" font-family="'Cairo', sans-serif" font-size="34" font-weight="700" fill="#ecfdf5">
      المنصة الجغرافية الذكية لإدارة المزارع والاستشعار عن بعد
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="225" font-family="'Cairo', sans-serif" font-size="20" font-weight="500" fill="#a7f3d0" opacity="0.9">
      تحليل صحة المحاصيل والتربة عبر مؤشرات الأقمار الصناعية (NDVI, NDWI, SAVI)
    </text>
    <text x="0" y="258" font-family="'Cairo', sans-serif" font-size="20" font-weight="500" fill="#a7f3d0" opacity="0.9">
      تحديد دقيق لحدود الحقول بالـ GPS ونماذج التنبؤ بالطقس وري الأراضي
    </text>

    <!-- Feature Pills Grid -->
    <g transform="translate(0, 310)">
      <!-- Pill 1: NDVI -->
      <g transform="translate(0, 0)">
        <rect width="180" height="52" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
        <text x="90" y="32" font-family="'Cairo', sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">
          🌱 مؤشرات صحة النبات
        </text>
      </g>
      <!-- Pill 2: GPS -->
      <g transform="translate(195, 0)">
        <rect width="180" height="52" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
        <text x="90" y="32" font-family="'Cairo', sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">
          📡 مساح الحدود GPS
        </text>
      </g>
      <!-- Pill 3: Weather -->
      <g transform="translate(390, 0)">
        <rect width="180" height="52" rx="12" fill="url(#cardGrad)" stroke="#facc15" stroke-width="1.5" />
        <text x="90" y="32" font-family="'Cairo', sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">
          🌦️ طقس ونماذج ري
        </text>
      </g>
    </g>

    <!-- Live Official URL Tag -->
    <text x="0" y="440" font-family="'IBM Plex Mono', monospace" font-size="18" font-weight="600" fill="#34d399">
      yasserelzanaty2-cloud.github.io/geoagri-pro
    </text>
  </g>
</svg>
